name: 自动评分系统
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted teacher tests
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout student revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: student-submission
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install trusted dependencies
        run: python -m pip install -r requirements.txt
      - name: Stage student source and outputs only
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('student-submission')
          # Reject links; grading/workflows/requirements always stay from teacher base.
          for name in ('src','results','student_tests','REPORT.md','AI_LOG.md'):
              item=source/name
              if not item.exists(): continue
              if item.is_symlink() or (item.is_dir() and any(p.is_symlink() for p in item.rglob('*'))):
                  raise RuntimeError('Submission symlinks are not supported')
              dest=Path(name)
              if item.is_dir():
                  if dest.exists(): shutil.rmtree(dest)
                  shutil.copytree(item,dest)
              else: shutil.copy2(item,dest)
          PY
      - name: Verify framework
        run: python -m pytest grading/test_framework.py grading/test_tracking.py -q
      - name: Grade student work
        run: python grading/calculate_grade.py
      - name: Write Actions Summary
        if: always()
        run: |
          if [ -f grade_result.txt ]; then cat grade_result.txt >> "$GITHUB_STEP_SUMMARY"; else echo '评分报告未生成，请查看日志。' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: grading-report
          path: |
            grade_report.json
            grade_result.txt
            .pytest-*.log
          include-hidden-files: true
          if-no-files-found: warn
